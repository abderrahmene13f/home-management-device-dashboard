services:
  dashboard:
    build: .
    ports: ["5080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Path: /app/data/devices.db
      Devices__Items__0__InfoUrl: http://host.docker.internal:1235/info
      Devices__Items__1__InfoUrl: http://host.docker.internal:1237/info
    volumes: ["dashboard-data:/app/data"]
    extra_hosts: ["host.docker.internal:host-gateway"]
volumes:
  dashboard-data:
